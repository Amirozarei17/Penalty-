<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>چالش پنالتی</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05070d;
    --bg-1:#0c1120;
    --bg-2:#141b30;
    --card:#161d33;
    --card-border:#2a3352;
    --gold:#ffc93c;
    --gold-2:#ff9f1c;
    --gold-dim:#8a742a;
    --win:#33d17a;
    --lose:#ff5c5c;
    --ink:#f4f6fb;
    --ink-dim:#8892ab;
    --pitch-dark:#0b1a12;
    --pitch-light:#123420;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    color:var(--ink);
    font-family:'Vazirmatn','Sora',sans-serif;
    overflow-x:hidden;
    max-width:100%;
    overscroll-behavior:none;
  }
  .app{
    max-width:480px; margin:0 auto;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding:14px 14px 22px;
    position:relative;
    z-index:2;
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-family:'Sora',sans-serif; font-weight:800; font-size:19px;
    letter-spacing:.2px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff2c0, var(--gold) 55%, var(--gold-2) 100%);
    box-shadow:0 0 12px rgba(255,201,60,.8);
  }
  .mode-switch{
    display:flex; background:var(--card); border:1px solid var(--card-border);
    border-radius:999px; padding:4px; gap:2px;
  }
  .mode-switch button{
    border:none; background:transparent; color:var(--ink-dim);
    font-family:inherit; font-weight:700; font-size:12.5px;
    padding:8px 12px; border-radius:999px; cursor:pointer;
    transition:.25s;
    white-space:nowrap;
  }
  .mode-switch button.active{
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
    color:#1a1206;
    box-shadow:0 4px 14px rgba(255,159,28,.35);
  }

  /* ---------- Scoreboard ---------- */
  .scoreboard{
    display:flex; align-items:stretch; gap:10px; margin-bottom:16px;
  }
  .score-card{
    flex:1.3; background:linear-gradient(160deg, var(--card) 0%, #10152a 100%);
    border:1px solid var(--card-border); border-radius:18px;
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .score-card::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120px 60px at 100% 0%, rgba(255,201,60,.15), transparent 70%);
  }
  .score-label{font-size:11px; color:var(--ink-dim); font-weight:700; letter-spacing:.5px;}
  .score-value{
    font-family:'Sora',sans-serif; font-weight:800; font-size:34px; line-height:1.15;
    display:flex; gap:2px; margin-top:2px;
    direction:ltr; justify-content:flex-end;
  }
  .digit{
    display:inline-block; min-width:20px; text-align:center;
    background:linear-gradient(180deg,#fff, var(--gold) 60%, var(--gold-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .digit.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes bump{
    0%{transform:translateY(0) scale(1);}
    40%{transform:translateY(-10px) scale(1.15);}
    100%{transform:translateY(0) scale(1);}
  }
  .mini-cards{flex:1; display:flex; flex-direction:column; gap:10px;}
  .mini-card{
    flex:1; background:var(--card); border:1px solid var(--card-border);
    border-radius:14px; padding:8px 12px; display:flex; flex-direction:column; justify-content:center;
  }
  .mini-card .l{font-size:10px; color:var(--ink-dim); font-weight:700;}
  .mini-card .v{font-family:'Sora',sans-serif; font-weight:700; font-size:17px; margin-top:1px;}
  .streak-flame{color:var(--gold); filter:drop-shadow(0 0 6px rgba(255,201,60,.6));}

  /* ---------- Pitch ---------- */
  .pitch-wrap{
    position:relative; flex:1;
    background:
      linear-gradient(180deg, var(--pitch-light) 0%, var(--pitch-dark) 100%);
    border-radius:24px; border:1px solid #1d3a28;
    overflow:hidden; padding:22px 16px 18px;
    display:flex; flex-direction:column; align-items:center;
    box-shadow:inset 0 0 60px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.7);
    min-height:400px;
  }
  .stripes{
    position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,.035) 0 40px, transparent 40px 80px);
    pointer-events:none;
  }
  .floodbeam{
    position:absolute; top:-40px; width:220px; height:340px;
    background:radial-gradient(ellipse at top, rgba(255,244,214,.16), transparent 70%);
    filter:blur(2px); pointer-events:none; opacity:.8;
    animation:beamPulse 4.5s ease-in-out infinite;
  }
  .floodbeam.l{left:-70px; transform:rotate(18deg);}
  .floodbeam.r{right:-70px; transform:rotate(-18deg); animation-delay:1.4s;}
  @keyframes beamPulse{0%,100%{opacity:.55;}50%{opacity:.95;}}

  .pitch-wrap::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(120% 90% at 50% 15%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .rig{
    position:absolute; top:6px; width:34px; height:20px; z-index:3; opacity:.9;
  }
  .rig.l{left:10px;} .rig.r{right:10px;}

  .goal{
    position:relative; width:100%; max-width:340px; height:200px;
    margin-top:6px; z-index:2;
  }
  .goal-svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .ground-shadow{
    position:absolute; left:8%; right:8%; bottom:2px; height:14px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(0,0,0,.55) 0%, transparent 72%);
    filter:blur(1px);
  }

  .zone-target{
    position:absolute; bottom:0; width:33.33%; height:100%;
    background:transparent;
  }
  .zone-target.left{left:0;}
  .zone-target.center{left:33.33%;}
  .zone-target.right{left:66.66%;}

  .keeper{
    position:absolute; bottom:10px; left:50%;
    width:52px; height:88px; margin-left:-26px;
    transform-origin:62% 88%;
    transition:transform .55s cubic-bezier(.22,1,.36,1);
    z-index:5; filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));
  }
  .keeper svg{width:100%; height:100%; overflow:visible;}

  .keeper.dive-left{transform:rotate(-62deg) translate(-58px,-10px);}
  .keeper.dive-right{transform:rotate(62deg) translate(58px,-10px);}
  .keeper.dive-center{transform:translateY(-8px) scale(1.05);}

  .ball{
    position:absolute; width:28px; height:28px;
    left:50%; bottom:10px; margin-left:-14px;
    z-index:6; filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));
    transition:
      left .55s cubic-bezier(.2,.65,.3,1),
      top .55s cubic-bezier(.2,.65,.3,1),
      bottom .55s cubic-bezier(.2,.65,.3,1),
      transform .55s cubic-bezier(.2,.65,.3,1);
  }
  .ball svg{width:100%; height:100%; display:block; animation:spin 1.4s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .ball.pos-left{left:14%; top:30px; transform:scale(.82);}
  .ball.pos-center{left:50%; top:12px; transform:scale(.88);}
  .ball.pos-right{left:86%; top:30px; transform:scale(.82);}
  .ball.result-goal-left{left:4%; top:20px;}
  .ball.result-goal-center{left:50%; top:6px;}
  .ball.result-goal-right{left:96%; top:20px;}

  .prompt-label{
    margin-top:auto; padding-top:10px;
    font-weight:800; font-size:14.5px; color:var(--ink);
    text-align:center; letter-spacing:.2px;
  }
  .zones-row{
    display:flex; gap:10px; width:100%; max-width:340px; margin-top:14px;
  }
  .zone-btn{
    flex:1; border:none; border-radius:16px; padding:16px 4px;
    background:linear-gradient(160deg, #1c2440, #121933);
    border:1px solid #2c3760;
    color:var(--ink); font-family:'Vazirmatn',sans-serif; font-weight:700; font-size:13.5px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .12s ease, box-shadow .2s ease, border-color .2s;
    cursor:pointer;
  }
  .zone-btn .arrow{font-size:20px;}
  .zone-btn:active{transform:scale(.93);}
  .zone-btn.enabled:hover{border-color:var(--gold-dim);}
  .zone-btn:disabled{opacity:.4;}
  .zone-btn.picked{
    background:linear-gradient(160deg, var(--gold), var(--gold-2));
    color:#1a1206; border-color:transparent;
    box-shadow:0 8px 20px -6px rgba(255,159,28,.6);
  }

  /* ---------- Result banner ---------- */
  .result-banner{
    position:fixed; left:50%; top:18%; transform:translate(-50%,-30px) scale(.9);
    background:rgba(10,13,24,.92); backdrop-filter:blur(6px);
    border:1px solid var(--card-border); border-radius:20px;
    padding:18px 26px; text-align:center;
    opacity:0; pointer-events:none; z-index:50;
    transition:opacity .28s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .result-banner.show{opacity:1; transform:translate(-50%,0) scale(1);}
  .result-banner .title{
    font-family:'Sora',sans-serif; font-weight:800; font-size:26px;
    direction:ltr;
  }
  .result-banner .title.win{color:var(--win); text-shadow:0 0 18px rgba(51,209,122,.55);}
  .result-banner .title.lose{color:var(--lose); text-shadow:0 0 18px rgba(255,92,92,.5);}
  .result-banner .sub{color:var(--ink-dim); font-size:12.5px; margin-top:4px; font-weight:600;}

  canvas#confetti{
    position:fixed; inset:0; pointer-events:none; z-index:40;
  }

  .footer-hint{
    text-align:center; color:var(--ink-dim); font-size:11px; margin-top:12px; font-weight:600;
  }
  .creator-credit{
    text-align:center; color:var(--ink-dim); font-size:10.5px; margin-top:6px; font-weight:600;
    opacity:.75;
  }
  .creator-credit span{color:var(--gold); font-weight:700;}

  /* ---------- Splash screen ---------- */
  .splash{
    position:fixed; inset:0; z-index:100;
    background:radial-gradient(120% 80% at 50% 30%, var(--bg-2) 0%, var(--bg-0) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .5s ease, visibility .5s;
  }
  .splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-ball{
    width:64px; height:64px;
    animation:splashBounce 1s cubic-bezier(.5,0,.5,1) infinite;
  }
  .splash-ball svg{width:100%; height:100%;}
  @keyframes splashBounce{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-22px) scale(1.02);}
  }
  .splash-title{
    font-family:'Sora',sans-serif; font-weight:800; font-size:20px; color:var(--ink);
    letter-spacing:.3px;
  }
  .splash-sub{color:var(--ink-dim); font-size:12px; font-weight:600;}

  /* ---------- Share button ---------- */
  .share-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin:12px auto 0; padding:10px 18px; width:fit-content;
    background:linear-gradient(135deg, #1c2440, #121933); border:1px solid var(--card-border);
    border-radius:999px; color:var(--ink); font-family:'Vazirmatn',sans-serif; font-weight:700;
    font-size:12.5px; cursor:pointer;
  }
  .share-btn:active{transform:scale(.95);}

  /* ---------- Achievement badge ---------- */
  .achv-banner{
    position:fixed; left:50%; top:26%; transform:translate(-50%,-20px) scale(.85);
    background:linear-gradient(160deg, #1e2a17, #0e1710);
    border:1px solid #3a5a2a; border-radius:18px;
    padding:14px 22px; text-align:center; display:flex; align-items:center; gap:12px;
    opacity:0; pointer-events:none; z-index:60;
    transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 10px 30px -8px rgba(0,0,0,.6);
  }
  .achv-banner.show{opacity:1; transform:translate(-50%,0) scale(1);}
  .achv-icon{font-size:30px; filter:drop-shadow(0 0 8px rgba(255,201,60,.7));}
  .achv-text .t1{font-weight:800; color:var(--gold); font-size:14px;}
  .achv-text .t2{font-weight:600; color:var(--ink-dim); font-size:11.5px; margin-top:2px;}

  /* ---------- Camera zoom on kick ---------- */
  .pitch-wrap{transition:transform .35s cubic-bezier(.2,.65,.3,1);}
  .pitch-wrap.zoom{transform:scale(1.06);}

  /* ---------- Night mode ---------- */
  body.night{
    --pitch-dark:#060d09; --pitch-light:#0b2015;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-ball">
    <svg viewBox="0 0 40 40">
      <defs>
        <radialGradient id="splashBallGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#eef0f5"/>
          <stop offset="100%" stop-color="#c9ced9"/>
        </radialGradient>
      </defs>
      <circle cx="20" cy="20" r="18.5" fill="url(#splashBallGrad)" stroke="#aab0c0" stroke-width="1"/>
      <g fill="#1c2030">
        <polygon points="20,12 24.5,15.2 22.8,20.4 17.2,20.4 15.5,15.2"/>
        <polygon points="8,17 12,15 12.8,19.8 9.4,23 6.2,20.5"/>
        <polygon points="32,17 28,15 27.2,19.8 30.6,23 33.8,20.5"/>
        <polygon points="14,31 18,27.5 22,27.5 26,31 20,35.5"/>
      </g>
    </svg>
  </div>
  <div class="splash-title">چالش پنالتی</div>
  <div class="splash-sub">در حال آماده‌سازی زمین...</div>
</div>

<canvas id="confetti"></canvas>

<div class="app">
  <div class="app-header">
    <div class="brand"><span class="dot"></span> چالش پنالتی</div>
    <div class="mode-switch">
      <button id="btnModeShoot" class="active">زدن ⚽</button>
      <button id="btnModeSave">گرفتن 🧤</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="score-card">
      <div class="score-label">امتیاز</div>
      <div class="score-value" id="scoreDigits"><span class="digit">0</span></div>
    </div>
    <div class="mini-cards">
      <div class="mini-card">
        <div class="l">رکورد پیاپی</div>
        <div class="v"><span class="streak-flame">🔥</span> <span id="curStreak">0</span></div>
      </div>
      <div class="mini-card">
        <div class="l">بهترین رکورد</div>
        <div class="v" id="bestStreak">0</div>
      </div>
    </div>
  </div>

  <div class="pitch-wrap">
    <div class="stripes"></div>
    <div class="floodbeam l"></div>
    <div class="floodbeam r"></div>
    <svg class="rig l" viewBox="0 0 34 20"><rect x="2" y="10" width="30" height="4" rx="2" fill="#2a3352"/><circle cx="7" cy="12" r="5" fill="#fff6da"/><circle cx="17" cy="12" r="5" fill="#fff6da"/><circle cx="27" cy="12" r="5" fill="#fff6da"/></svg>
    <svg class="rig r" viewBox="0 0 34 20"><rect x="2" y="10" width="30" height="4" rx="2" fill="#2a3352"/><circle cx="7" cy="12" r="5" fill="#fff6da"/><circle cx="17" cy="12" r="5" fill="#fff6da"/><circle cx="27" cy="12" r="5" fill="#fff6da"/></svg>

    <div class="goal" id="goal">
      <svg class="goal-svg" viewBox="0 0 340 200" preserveAspectRatio="none">
        <defs>
          <linearGradient id="postGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#c7cdda"/>
          </linearGradient>
          <linearGradient id="netBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e9edf5" stop-opacity=".9"/>
            <stop offset="1" stop-color="#c9d0dd" stop-opacity=".75"/>
          </linearGradient>
          <pattern id="netGrid" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M16 0 L0 0 0 16" fill="none" stroke="#9aa4bb" stroke-width="1" opacity=".55"/>
          </pattern>
        </defs>

        <polygon points="34,14 306,14 316,48 24,48" fill="url(#netBack)"/>
        <polygon points="34,14 306,14 316,48 24,48" fill="url(#netGrid)"/>
        <polygon points="24,14 316,14 316,190 24,190" fill="url(#netBack)" opacity=".5"/>
        <polygon points="24,14 316,14 316,190 24,190" fill="url(#netGrid)"/>
        <polygon points="24,14 34,14 24,48 14,48" fill="#b9c1d4" opacity=".65"/>
        <polygon points="306,14 316,14 316,48 306,48" fill="#b9c1d4" opacity=".65"/>

        <rect x="18" y="8" width="12" height="186" rx="3" fill="url(#postGrad)"/>
        <rect x="310" y="8" width="12" height="186" rx="3" fill="url(#postGrad)"/>
        <rect x="18" y="4" width="304" height="12" rx="4" fill="url(#postGrad)"/>
        <rect x="4" y="192" width="332" height="5" rx="2.5" fill="#f4f6fb"/>
      </svg>

      <div class="keeper dive-center" id="keeper">
        <svg viewBox="0 0 60 100">
          <defs>
            <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a3f4c"/>
              <stop offset="1" stop-color="#15171f"/>
            </linearGradient>
            <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2b2e38"/>
              <stop offset="1" stop-color="#111319"/>
            </linearGradient>
          </defs>
          <ellipse cx="30" cy="92" rx="16" ry="4" fill="rgba(0,0,0,.35)"/>
          <!-- ساق‌ها و کفش -->
          <rect x="19" y="62" width="8" height="24" rx="3" fill="#0d0f16"/>
          <rect x="33" y="62" width="8" height="24" rx="3" fill="#0d0f16"/>
          <rect x="15" y="65" width="12" height="7" rx="3" fill="#000"/>
          <rect x="33" y="65" width="12" height="7" rx="3" fill="#000"/>
          <rect x="14" y="82" width="13" height="6" rx="3" fill="#050608"/>
          <rect x="33" y="82" width="13" height="6" rx="3" fill="#050608"/>
          <!-- شورت -->
          <rect x="17" y="56" width="26" height="12" rx="4" fill="#101319"/>
          <!-- پیراهن -->
          <rect x="14" y="28" width="32" height="32" rx="11" fill="url(#jersey)"/>
          <path d="M22 30 L30 42 L38 30" fill="none" stroke="#565c6e" stroke-width="2" opacity=".6"/>
          <!-- دست‌ها -->
          <rect x="-2" y="26" width="26" height="10.5" rx="5" fill="url(#jersey)" transform="rotate(-16 11 31)"/>
          <rect x="36" y="26" width="26" height="10.5" rx="5" fill="url(#jersey)" transform="rotate(16 49 31)"/>
          <!-- دستکش‌ها -->
          <circle cx="4" cy="23" r="8.5" fill="url(#glove)" stroke="#4a4f5c" stroke-width="1.2"/>
          <rect x="1" y="18" width="6" height="4" rx="1.5" fill="#eceef2"/>
          <circle cx="56" cy="23" r="8.5" fill="url(#glove)" stroke="#4a4f5c" stroke-width="1.2"/>
          <rect x="53" y="18" width="6" height="4" rx="1.5" fill="#eceef2"/>
          <!-- سر (چهره‌ی جنریک، بدون هویت خاص) -->
          <circle cx="30" cy="17" r="11.5" fill="#caa377"/>
          <path d="M19 13 q11 -11 22 0 q-1 -8 -11 -8 q-10 0 -11 8 Z" fill="#1c1a19"/>
        </svg>
      </div>

      <div class="ball pos-center" id="ball">
        <svg viewBox="0 0 40 40">
          <defs>
            <radialGradient id="ballGrad" cx="35%" cy="30%" r="75%">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="55%" stop-color="#eef0f5"/>
              <stop offset="100%" stop-color="#c9ced9"/>
            </radialGradient>
          </defs>
          <circle cx="20" cy="20" r="18.5" fill="url(#ballGrad)" stroke="#aab0c0" stroke-width="1"/>
          <g fill="#1c2030">
            <polygon points="20,12 24.5,15.2 22.8,20.4 17.2,20.4 15.5,15.2"/>
            <polygon points="8,17 12,15 12.8,19.8 9.4,23 6.2,20.5"/>
            <polygon points="32,17 28,15 27.2,19.8 30.6,23 33.8,20.5"/>
            <polygon points="14,31 18,27.5 22,27.5 26,31 20,35.5"/>
          </g>
        </svg>
      </div>

      <div class="ground-shadow"></div>
    </div>

    <div class="prompt-label" id="promptLabel">جهت ضربه‌ات رو انتخاب کن</div>
    <div class="zones-row">
      <button class="zone-btn enabled" data-zone="right"><span class="arrow">➡️</span>راست</button>
      <button class="zone-btn enabled" data-zone="center"><span class="arrow">⏺️</span>وسط</button>
      <button class="zone-btn enabled" data-zone="left"><span class="arrow">⬅️</span>چپ</button>
    </div>
  </div>

  <div class="footer-hint">امتیازت به‌صورت خودکار روی حساب تلگرامت ذخیره می‌شه</div>
  <button class="share-btn" id="shareBtn">🔗 اشتراک‌گذاری امتیاز</button>
  <div class="creator-credit">ساخته‌شده توسط <span>امیررضا زارعی</span></div>
</div>

<div class="achv-banner" id="achvBanner">
  <div class="achv-icon" id="achvIcon">🏅</div>
  <div class="achv-text">
    <div class="t1" id="achvTitle">مدال برنزی!</div>
    <div class="t2" id="achvSub">۱۰ برد پیاپی</div>
  </div>
</div>

<div class="result-banner" id="resultBanner">
  <div class="title" id="resultTitle">GOAL!</div>
  <div class="sub" id="resultSub">امتیاز: 1</div>
</div>

<script>
(function(){
  "use strict";

  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0c1120'); } catch(e){}
    try { tg.setBackgroundColor('#05070d'); } catch(e){}
  }

  // شب/روز تصادفی برای تنوع بصری
  if (Math.random() < 0.5) document.body.classList.add("night");

  // صفحه‌ی بارگذاری اولیه (مستقل از لود فونت/اسکریپت‌های خارجی)
  setTimeout(function(){
    var sp = document.getElementById("splash");
    if (sp) sp.classList.add("hide");
  }, 900);

  function haptic(type, style){
    if (!tg || !tg.HapticFeedback) return;
    try{
      if (type === 'impact') tg.HapticFeedback.impactOccurred(style || 'medium');
      if (type === 'notification') tg.HapticFeedback.notificationOccurred(style || 'success');
      if (type === 'selection') tg.HapticFeedback.selectionChanged();
    }catch(e){}
  }

  // ---------------- صداهای ساخته‌شده با Web Audio (بدون فایل خارجی) ----------------
  var actx = null;
  function getCtx(){
    if (!actx){
      try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = false; }
    }
    return actx || null;
  }
  function tone(freq, dur, type, startGain){
    var ctx = getCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.value = startGain || 0.08;
    osc.connect(gain); gain.connect(ctx.destination);
    var now = ctx.currentTime;
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.start(now);
    osc.stop(now + dur);
  }
  function soundKick(){ tone(180, 0.12, "square", 0.09); }
  function soundGoal(){
    [523, 659, 784, 1046].forEach(function(f, i){
      setTimeout(function(){ tone(f, 0.28, "triangle", 0.07); }, i * 80);
    });
  }
  function soundSave(){ tone(140, 0.35, "sawtooth", 0.08); }
  function soundAchv(){
    [660, 880, 1108].forEach(function(f, i){
      setTimeout(function(){ tone(f, 0.3, "sine", 0.07); }, i * 100);
    });
  }

  // ---------------- Storage (CloudStorage with localStorage fallback) ----------------
  function storageGet(key, cb){
    if (tg && tg.CloudStorage && tg.CloudStorage.getItem){
      tg.CloudStorage.getItem(key, function(err, value){ cb(err ? null : value); });
    } else {
      cb(localStorage.getItem(key));
    }
  }
  function storageSet(key, value){
    if (tg && tg.CloudStorage && tg.CloudStorage.setItem){
      tg.CloudStorage.setItem(key, value, function(){});
    } else {
      localStorage.setItem(key, value);
    }
  }

  var ZONES = ["left","center","right"];
  var state = {
    mode: "shoot",
    data: {
      shoot: {score:0, played:0, streak:0, best:0},
      save:  {score:0, played:0, streak:0, best:0}
    },
    busy:false
  };

  function loadMode(mode){
    storageGet("pk_" + mode, function(raw){
      if (raw){
        try{ state.data[mode] = JSON.parse(raw); }catch(e){}
      }
      renderScoreboard();
    });
  }
  function persistMode(mode){
    storageSet("pk_" + mode, JSON.stringify(state.data[mode]));
  }

  // ---------------- DOM refs ----------------
  var $ = function(id){ return document.getElementById(id); };
  var scoreDigits = $("scoreDigits");
  var curStreakEl = $("curStreak");
  var bestStreakEl = $("bestStreak");
  var promptLabel = $("promptLabel");
  var ball = $("ball");
  var keeper = $("keeper");
  var resultBanner = $("resultBanner");
  var resultTitle = $("resultTitle");
  var resultSub = $("resultSub");
  var zoneButtons = Array.prototype.slice.call(document.querySelectorAll(".zone-btn"));
  var btnModeShoot = $("btnModeShoot");
  var btnModeSave = $("btnModeSave");
  var pitchWrap = document.querySelector(".pitch-wrap");
  var shareBtn = $("shareBtn");
  var achvBanner = $("achvBanner");
  var achvIcon = $("achvIcon");
  var achvTitle = $("achvTitle");
  var achvSub = $("achvSub");

  var ACHIEVEMENTS = [
    {n:5,  icon:"🥉", title:"مدال برنزی!", sub:"۵ برد پیاپی"},
    {n:10, icon:"🥈", title:"مدال نقره‌ای!", sub:"۱۰ برد پیاپی"},
    {n:25, icon:"🥇", title:"مدال طلایی!", sub:"۲۵ برد پیاپی"},
    {n:50, icon:"💎", title:"الماس!", sub:"۵۰ برد پیاپی"},
    {n:100,icon:"👑", title:"افسانه‌ای!", sub:"۱۰۰ برد پیاپی"}
  ];
  function checkAchievement(streak){
    var a = ACHIEVEMENTS.filter(function(x){ return x.n === streak; })[0];
    if (!a) return;
    achvIcon.textContent = a.icon;
    achvTitle.textContent = a.title;
    achvSub.textContent = a.sub;
    achvBanner.classList.add("show");
    soundAchv();
    haptic("notification", "success");
    setTimeout(function(){ achvBanner.classList.remove("show"); }, 1900);
  }

  function renderScoreboard(){
    var d = state.data[state.mode];
    var scoreStr = String(d.score);
    scoreDigits.innerHTML = scoreStr.split("").map(function(ch){
      return '<span class="digit">' + ch + '</span>';
    }).join("");
    curStreakEl.textContent = d.streak;
    bestStreakEl.textContent = d.best;
    promptLabel.textContent = state.mode === "shoot"
      ? "جهت ضربه‌ات رو انتخاب کن"
      : "جهت شیرجه‌ات رو انتخاب کن";
  }

  function bumpScore(){
    var digits = scoreDigits.querySelectorAll(".digit");
    digits.forEach(function(d){
      d.classList.remove("bump");
      void d.offsetWidth;
      d.classList.add("bump");
    });
  }

  function setMode(mode){
    if (state.busy) return;
    state.mode = mode;
    btnModeShoot.classList.toggle("active", mode === "shoot");
    btnModeSave.classList.toggle("active", mode === "save");
    resetScene();
    renderScoreboard();
    haptic("selection");
  }
  btnModeShoot.addEventListener("click", function(){ setMode("shoot"); });
  btnModeSave.addEventListener("click", function(){ setMode("save"); });

  function resetScene(){
    ball.className = "ball pos-center";
    keeper.className = "keeper dive-center";
    zoneButtons.forEach(function(b){ b.classList.remove("picked"); b.disabled = false; });
    resultBanner.classList.remove("show");
  }

  function randomZone(){
    return ZONES[Math.floor(Math.random() * 3)];
  }

  // سختی پیش‌رونده: هرچی رکورد پیاپی فعلی بیشتر باشه، حریف باهوش‌تر عمل می‌کنه
  function opponentZone(playerZone, streak){
    var matchChance = Math.min(0.33 + streak * 0.025, 0.62);
    var wantsMatch = Math.random() < matchChance;
    if (wantsMatch) return playerZone;
    var others = ZONES.filter(function(z){ return z !== playerZone; });
    return others[Math.floor(Math.random() * others.length)];
  }

  function playRound(zone){
    if (state.busy) return;
    state.busy = true;
    haptic("impact", "light");
    soundKick();
    pitchWrap.classList.add("zoom");
    setTimeout(function(){ pitchWrap.classList.remove("zoom"); }, 260);

    zoneButtons.forEach(function(b){
      b.disabled = true;
      if (b.getAttribute("data-zone") === zone) b.classList.add("picked");
    });

    var mode = state.mode;
    var curStreak = state.data[mode].streak;
    var oppZone = opponentZone(zone, curStreak);
    var shotZone, keeperZone, won;

    if (mode === "shoot"){
      shotZone = zone; keeperZone = oppZone;
      won = shotZone !== keeperZone;
    } else {
      keeperZone = zone; shotZone = oppZone;
      won = shotZone === keeperZone;
    }

    // انیمیشن: توپ به سمت جهت شوت پرواز می‌کنه، دروازه‌بان به سمت جهتش شیرجه می‌زنه
    requestAnimationFrame(function(){
      ball.className = "ball pos-" + shotZone;
      keeper.className = "keeper dive-" + keeperZone;
    });

    setTimeout(function(){
      var result = (mode === "shoot") ? (won ? "goal" : "saved") : (won ? "saved" : "goal");
      if (result === "goal"){
        ball.className = "ball result-goal-" + shotZone;
      } else {
        ball.className = "ball pos-" + shotZone;
      }
      finishRound(mode, won, result);
    }, 560);
  }

  function finishRound(mode, won, result){
    var d = state.data[mode];
    d.played += 1;
    var newStreak = false;
    if (won){
      d.score += 1;
      d.streak += 1;
      d.best = Math.max(d.best, d.streak);
      newStreak = d.streak;
    } else {
      d.streak = 0;
    }
    persistMode(mode);
    renderScoreboard();
    if (won) bumpScore();

    var title, sub, cls;
    if (mode === "shoot"){
      if (result === "goal"){ title = "GOAL!"; cls = "win"; sub = "گل زیبا! امتیاز: " + d.score; }
      else { title = "دفاع شد"; cls = "lose"; sub = "دروازه‌بان جهتت رو گرفت"; }
    } else {
      if (result === "saved"){ title = "SAVE!"; cls = "win"; sub = "سیو عالی! امتیاز: " + d.score; }
      else { title = "گل خوردیم"; cls = "lose"; sub = "این دفعه جهتت اشتباه بود"; }
    }
    resultTitle.textContent = title;
    resultTitle.className = "title " + cls;
    resultSub.textContent = sub;
    resultBanner.classList.add("show");

    haptic("notification", won ? "success" : "error");
    if (won){ burstConfetti(); soundGoal(); }
    else { shakeScreen(); soundSave(); }

    if (newStreak) checkAchievement(newStreak);

    setTimeout(function(){
      resultBanner.classList.remove("show");
      setTimeout(function(){
        resetScene();
        state.busy = false;
      }, 260);
    }, 1100);
  }

  zoneButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      playRound(btn.getAttribute("data-zone"));
    });
  });

  function shakeScreen(){
    document.body.style.transition = "transform .06s";
    var seq = [[-6,0],[6,0],[-4,0],[4,0],[0,0]];
    var i = 0;
    var iv = setInterval(function(){
      if (i >= seq.length){ clearInterval(iv); document.body.style.transform=""; return; }
      document.body.style.transform = "translateX(" + seq[i][0] + "px)";
      i++;
    }, 55);
  }

  // ---------------- Confetti ----------------
  var canvas = $("confetti");
  var ctx = canvas.getContext("2d");
  function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  var particles = [];
  var COLORS = ["#ffc93c","#ff9f1c","#33d17a","#5cc8ff","#ffffff"];
  function burstConfetti(){
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight * 0.32;
    for (var i = 0; i < 46; i++){
      var angle = Math.random() * Math.PI * 2;
      var speed = 2 + Math.random() * 5;
      particles.push({
        x:cx, y:cy,
        vx:Math.cos(angle) * speed,
        vy:Math.sin(angle) * speed - 2,
        size:3 + Math.random() * 4,
        color:COLORS[Math.floor(Math.random()*COLORS.length)],
        life:0, maxLife:50 + Math.random()*20,
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3
      });
    }
  }
  function tickConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles = particles.filter(function(p){ return p.life < p.maxLife; });
    particles.forEach(function(p){
      p.life++;
      p.vy += 0.12;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      var alpha = 1 - (p.life / p.maxLife);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(alpha, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*1.6);
      ctx.restore();
    });
    requestAnimationFrame(tickConfetti);
  }
  requestAnimationFrame(tickConfetti);

  // ---------------- اشتراک‌گذاری امتیاز ----------------
  shareBtn.addEventListener("click", function(){
    var d = state.data[state.mode];
    var modeLabel = state.mode === "shoot" ? "زدن پنالتی" : "گرفتن پنالتی";
    var text = "⚽ توی چالش پنالتی، حالت " + modeLabel + " امتیاز " + d.score +
      " گرفتم و رکورد پیاپیم " + d.best + " شد! تو هم امتحان کن 👇";
    var pageUrl = window.location.href;
    var shareUrl = "https://t.me/share/url?url=" + encodeURIComponent(pageUrl) +
      "&text=" + encodeURIComponent(text);
    haptic("selection");
    if (tg && tg.openTelegramLink){
      try{ tg.openTelegramLink(shareUrl); return; }catch(e){}
    }
    window.open(shareUrl, "_blank");
  });

  // ---------------- Init ----------------
  loadMode("shoot");
  loadMode("save");
  renderScoreboard();
})();
</script>
</body>
</html>
